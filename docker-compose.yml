version: "3.9"

services:
  api:
    build: .
    container_name: autopilot-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  dashboard:
    build: .
    container_name: autopilot-dashboard
    command: ["streamlit", "run", "app/dashboard/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    restart: unless-stopped

  # Optional: run Ollama locally so tier-1 requests can route to a free,
  # self-hosted model. Comment out and set OLLAMA_BASE_URL elsewhere if you
  # already run Ollama on the host.
  ollama:
    image: ollama/ollama:latest
    container_name: autopilot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
